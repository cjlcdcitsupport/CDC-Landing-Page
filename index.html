<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDC IT Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e2f6e; --navy2:#1a47a0; --blue:#1556d6; --sky:#3fb6ff; --red:#ff3b4f; --yellow:#ffd21f;
  --text:#eaf2ff; --muted:#9db3d9; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{display:flex;flex-direction:column;min-height:100vh;font-family:'Kanit','Prompt',sans-serif;color:var(--text);background:var(--navy);overflow-x:hidden;cursor:default}
a{color:inherit;text-decoration:none}

/* ===== Background ===== */
.bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(1200px 700px at 10% -10%,#2b6fe0 0%,transparent 60%),radial-gradient(900px 600px at 110% 10%,#7a2346 0%,transparent 55%),linear-gradient(180deg,#14408f 0%,#0c2b66 100%)}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.6;z-index:-2;animation:float 18s ease-in-out infinite}
.b1{width:480px;height:480px;background:var(--blue);top:-120px;left:-120px}
.b2{width:380px;height:380px;background:var(--red);bottom:-120px;right:-80px;animation-delay:-6s;opacity:.4}
.b3{width:340px;height:340px;background:var(--sky);top:40%;left:55%;animation-delay:-12s;opacity:.4}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.1)}66%{transform:translate(-40px,50px) scale(.95)}}
#particles{position:fixed;inset:0;z-index:-1;pointer-events:none}
.grid{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at center,#000 10%,transparent 70%);opacity:.25}
.glow{position:fixed;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(63,182,255,.18),transparent 65%);transform:translate(-50%,-50%);transition:opacity .3s;mix-blend-mode:screen}

/* ===== Layout ===== */
.wrap{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:22px 20px 0;position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.logo{background:#fff;border-radius:14px;padding:6px 14px;display:flex;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:drop .8s cubic-bezier(.2,.9,.3,1.2) both}
.logo img{height:38px;display:block}
.hright{display:flex;align-items:center;gap:10px;animation:drop .8s .1s cubic-bezier(.2,.9,.3,1.2) both}
.clock{font-family:'Prompt';text-align:right;line-height:1.15;padding:6px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);backdrop-filter:blur(10px)}
.clock .t{font-size:20px;font-weight:500;letter-spacing:1px;font-variant-numeric:tabular-nums}
.clock .d{font-size:12px;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.lang button{font:inherit;font-size:14px;color:var(--muted);background:none;border:0;padding:10px 14px;cursor:pointer;transition:.25s}
.lang button.on{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff}
@keyframes drop{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}

/* ===== Hero ===== */
.hero{text-align:center;padding:56px 0 34px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:6px 14px;border-radius:99px;border:1px solid rgba(255,59,79,.4);background:rgba(255,59,79,.1);color:#ffc2c9;animation:up .7s .15s both}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,59,79,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(255,59,79,0)}100%{box-shadow:0 0 0 0 rgba(255,59,79,0)}}
h1{font-size:clamp(34px,6vw,64px);font-weight:700;line-height:1.1;margin:18px 0 12px;animation:up .7s .25s both}
h1 .g{background:linear-gradient(90deg,var(--sky),#fff 40%,var(--red) 75%,var(--sky));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.sub{color:var(--muted);font-size:clamp(15px,2vw,18px);font-weight:300;max-width:620px;margin:0 auto;animation:up .7s .35s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* ===== Toolbar ===== */
.tools{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:26px;animation:up .7s .45s both}
.search{flex:1 1 300px;max-width:420px;position:relative}
.search input{width:100%;font:inherit;font-size:15px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px 13px 44px;outline:none;backdrop-filter:blur(10px);transition:.25s}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(63,182,255,.18)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:9px 16px;cursor:pointer;transition:.25s;display:flex;gap:6px;align-items:center}
.tab b{font-weight:500;font-size:11px;background:rgba(255,255,255,.1);border-radius:99px;padding:1px 7px}
.tab:hover{color:#fff;border-color:rgba(63,182,255,.5)}
.tab.on{color:#fff;background:linear-gradient(135deg,var(--blue),#0d3fa8);border-color:transparent;box-shadow:0 6px 20px rgba(21,86,214,.45)}

/* ===== Cards ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;padding-bottom:40px}
.card{position:relative;border-radius:22px;padding:1px;background:linear-gradient(135deg,rgba(63,182,255,.5),rgba(255,255,255,.06) 40%,rgba(255,59,79,.45));opacity:0;transform:translateY(30px) scale(.97);transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s;transform-style:preserve-3d;will-change:transform}
.card.show{animation:cardIn .7s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes cardIn{to{opacity:1;transform:none}}
.card:hover{box-shadow:0 22px 50px rgba(0,0,0,.45),0 0 40px rgba(63,182,255,.18)}
.inner{position:relative;height:100%;border-radius:21px;padding:24px;background:linear-gradient(160deg,rgba(26,66,140,.9),rgba(14,40,96,.92));overflow:hidden;display:flex;flex-direction:column}
.inner::before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),rgba(63,182,255,.16),transparent 45%);opacity:0;transition:.3s;pointer-events:none}
.card:hover .inner::before{opacity:1}
.shine{position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.08),transparent);transform:skewX(-20deg);transition:left .8s}
.card:hover .shine{left:130%}
.ctop{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.icon{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.35);transition:transform .4s}
.card:hover .icon{transform:rotate(-8deg) scale(1.08)}
.icon svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.04)}
.card h3{font-size:21px;font-weight:600;margin-bottom:6px}
.card p{color:var(--muted);font-size:14.5px;font-weight:300;line-height:1.6;flex:1}
.cfoot{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#9fe8b8}
.status i{width:7px;height:7px;border-radius:50%;background:#2ee07a;box-shadow:0 0 8px #2ee07a;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.go{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;padding:9px 16px;border-radius:12px;background:linear-gradient(135deg,var(--red),#d31f36);box-shadow:0 6px 18px rgba(255,59,79,.35);transition:.3s}
.go svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;transition:transform .3s}
.card:hover .go{gap:12px}
.card:hover .go svg{transform:translateX(3px)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0;display:none}

/* ===== Footer ===== */
footer{position:relative;z-index:1;margin-top:10px;background:linear-gradient(90deg,#0b2d73,#0d3a94 60%,#0b2d73);border-top:1px solid rgba(255,255,255,.15)}
.fbar{max-width:1180px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.contact{display:flex;align-items:center;gap:4px 14px;flex-wrap:wrap;font-size:13px}
.contact .lbl{color:#cfe0ff}
.contact span{display:flex;align-items:center;gap:8px}
.contact svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.contact .sep{width:1px;height:14px;background:rgba(255,255,255,.35)}
.contact a:hover{color:var(--yellow)}
.badge{display:flex;align-items:center;gap:8px}
.badge b{display:inline-block;background:var(--yellow);color:#0b2d73;font-weight:700;font-size:13px;padding:3px 12px;border-radius:8px;box-shadow:0 2px 0 #c9a400;animation:bob 3s ease-in-out infinite}
.badge small{font-size:11px;color:#dfe9ff}
@keyframes bob{50%{transform:translateY(-3px)}}
.credit{text-align:center;font-size:11px;color:var(--muted);padding:5px 20px;background:#0a2557}
.credit strong{color:#cfe0ff;font-weight:500}

@media (max-width:640px){
  .hero{padding:36px 0 26px}
  .clock{display:none}
  .contact .sep{display:none}
  .fbar{justify-content:center;text-align:center}
  .contact{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
@media (hover:none){.glow{display:none}}

/* ===== Theme: bright CP Axtra / Makro poster style ===== */
:root{--blue:#0f4fbf;--sky:#4aa8ff;--red:#e3192b;--text:#0b2e6b;--muted:#4d6a9c;--line:rgba(15,79,191,.15)}
.bg{background:radial-gradient(1000px 600px at 15% 0%,#5aa9ff 0%,transparent 60%),radial-gradient(800px 500px at 100% 100%,#1c5fd0 0%,transparent 60%),linear-gradient(160deg,#2f86f0 0%,#1a63d8 55%,#1452c2 100%)}
.blob{opacity:.35!important}
.b1{background:#8fd0ff}.b2{background:#ff6b78}.b3{background:#ffffff;opacity:.18!important}
.grid{background-image:linear-gradient(rgba(255,255,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.15) 1px,transparent 1px);opacity:.35}
.glow{background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}

/* header controls on blue */
.clock{background:rgba(255,255,255,.95);border-color:#fff;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.15)}
.clock .d{color:var(--muted)}
.lang{background:rgba(255,255,255,.95);border-color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.lang button{color:var(--muted)}
.lang button.on{background:var(--blue)}

/* hero */
.pill{background:#fff;border-color:#fff;color:var(--red);font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.15)}
h1{color:#fff;text-shadow:0 4px 0 #0c3d99,0 10px 24px rgba(0,0,0,.25)}
h1 .g{display:inline-block;background:var(--red);color:#fff;-webkit-text-fill-color:#fff;padding:0 .3em .05em;border-radius:.25em;transform:rotate(-2deg);text-shadow:none;box-shadow:0 6px 0 #a10f1d,0 14px 28px rgba(0,0,0,.25);animation:wob 4s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(1deg) scale(1.03)}}
.sub{color:#eaf3ff}

/* toolbar */
.search input{background:#fff;border-color:#fff;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.15)}
.search input:focus{box-shadow:0 0 0 4px rgba(255,255,255,.45)}
.tab{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);color:#fff}
.tab b{background:rgba(255,255,255,.25)}
.tab:hover{background:rgba(255,255,255,.3);border-color:#fff}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 6px 20px rgba(0,0,0,.18)}
.tab.on b{background:var(--blue);color:#fff}

/* cards: white panel with blue header strip */
.card{background:#fff;padding:0;border-radius:20px;box-shadow:0 12px 30px rgba(6,40,110,.28)}
.card:hover{box-shadow:0 22px 44px rgba(6,40,110,.38)}
.inner{background:#fff;border-radius:20px;padding:0}
.inner::before{background:radial-gradient(300px circle at var(--mx,50%) var(--my,0%),rgba(47,134,240,.10),transparent 50%)}
.shine{background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);z-index:2}
.ctop{margin:0;padding:14px 18px;background:linear-gradient(90deg,#0d4aa8,#1a63d8);align-items:center;gap:12px;justify-content:flex-start;border-radius:20px 20px 0 0}
.icon{width:48px;height:48px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.icon svg{width:24px;height:24px}
.ctop .cat{margin-left:auto;background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff}
.card h3{color:#fff;font-size:19px;margin:0;flex:1;line-height:1.25}
.body{padding:18px 20px 18px;display:flex;flex-direction:column;flex:1}
.card p{color:#33507f;font-weight:400}
.cfoot{border-top:1px dashed rgba(15,79,191,.2);margin-top:16px;padding-top:14px}
.status{color:#14924a;font-weight:500}
.status i{background:#18b45a;box-shadow:0 0 8px #18b45a}
.go{background:var(--red);box-shadow:0 4px 0 #a10f1d}
.empty{color:#fff}

footer{background:#0d3f9a;border-top:0;color:#fff}
.search svg{z-index:1}
.credit{background:#0a3282;color:#bcd3ff}
/* Variant 2 */
.cards{gap:24px;margin-top:20px}
.card{border-radius:18px;box-shadow:0 10px 30px rgba(15,60,140,.14)}
.card:hover{box-shadow:0 20px 44px rgba(15,60,140,.24)}
.inner{border-radius:18px;border-top:6px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,var(--blue),var(--sky) 60%,var(--red)) border-box}
.ctop{background:#fff;border-radius:0;padding:20px 20px 4px}
.icon{border-radius:14px;border:0;width:52px;height:52px}
.card h3{color:var(--text)}
.ctop .cat{background:#eef5ff;border-color:#d6e6ff;color:var(--blue)}
.body{padding:10px 20px 20px}

/* hero left */
.hero{text-align:left;max-width:820px}
.sub{margin:0}
/* open button: light, not heavy */
.go{background:#fff0f1;color:var(--red);font-weight:500;letter-spacing:.2px;padding:8px 8px 8px 16px;border-radius:99px;box-shadow:none;border:1px solid #ffd3d8;transition:background .3s,color .3s,box-shadow .3s}
.go svg{stroke:#fff;width:14px;height:14px;box-sizing:content-box;padding:5px;border-radius:50%;background:var(--red);transition:transform .3s,background .3s}
.card:hover .go{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 6px 16px rgba(227,25,43,.3)}
.card:hover .go svg{background:#fff;stroke:var(--red);transform:translateX(2px)}
</style>
</head>

          <h3>${a.name[lang]}</h3>
          <span class="cat">${CATEGORIES[a.cat]?.[lang] || ''}</span>
        </div>
        <div class="body">
          <p>${a.desc[lang]}</p>
          <div class="cfoot">
            <span class="status"><i></i>${T[lang].online}</span>
            <span class="go">${T[lang].open}<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          </div>
        </div>
      </div>
    </a>`).join('') + `<div class="empty" style="display:${items.length?'none':'block'}">${T[lang].empty}</div>`;
  requestAnimationFrame(() => document.querySelectorAll('.card').forEach(c => c.classList.add('show')));
  bindTilt();
}

function bindTilt(){
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      card.style.transform = `perspective(900px) rotateX(${(y/r.height-.5)*-8}deg) rotateY(${(x/r.width-.5)*8}deg) translateY(-6px)`;
      card.querySelector('.inner').style.setProperty('--mx', x+'px');
      card.querySelector('.inner').style.setProperty('--my', y+'px');
    });
    card.addEventListener('mouseleave', () => card.style.transform = '');
    card.addEventListener('animationend', () => { card.style.opacity = 1; card.classList.remove('show'); card.style.transform=''; }, {once:true});
  });
}

/* ===== Events ===== */
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  lang = b.dataset.l; try{ localStorage.setItem('cdc_lang', lang); }catch(e){} applyLang();
});
$('#tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if(!t) return; curCat = t.dataset.c; renderTabs(); renderCards(); });
$('#q').addEventListener('input', e => { q = e.target.value; renderCards(); });

/* ===== Clock ===== */
function tick(){
  const n = new Date(), L = T[lang];
  $('#time').textContent = n.toLocaleTimeString(L.loc,{hour12:false});
  $('#date').textContent = L.days[n.getDay()] + ' ' + n.toLocaleDateString(L.loc,{day:'numeric',month:'short',year:'numeric'});
}
setInterval(tick, 1000);
$('#yr').textContent = new Date().getFullYear();

/* ===== Cursor glow ===== */
const glow = $('#glow');
let gx = innerWidth/2, gy = innerHeight/3, tx = gx, ty = gy;
addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
(function loop(){ gx += (tx-gx)*.12; gy += (ty-gy)*.12; glow.style.left = gx+'px'; glow.style.top = gy+'px'; requestAnimationFrame(loop); })();

/* ===== Particles ===== */
const cv = $('#particles'), ctx = cv.getContext('2d');
let W, H, P = [], mouse = {x:-999, y:-999};
const COLORS = ['#ffffff','#cfe6ff','#ff8a95','#ffffff'];
function resize(){
  W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio;
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
  const n = Math.min(90, Math.floor(innerWidth*innerHeight/16000));
  P = Array.from({length:n}, () => ({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.35*devicePixelRatio, vy:(Math.random()-.5)*.35*devicePixelRatio, r:(Math.random()*1.8+.6)*devicePixelRatio, c:COLORS[Math.floor(Math.random()*COLORS.length)]}));
}
addEventListener('resize', resize);
addEventListener('mousemove', e => { mouse.x = e.clientX*devicePixelRatio; mouse.y = e.clientY*devicePixelRatio; });
function draw(){
  ctx.clearRect(0,0,W,H);
  const link = 130*devicePixelRatio;
  for(const p of P){
    const dx = p.x-mouse.x, dy = p.y-mouse.y, d = Math.hypot(dx,dy);
    if(d < 120*devicePixelRatio){ p.x += dx/d*1.2; p.y += dy/d*1.2; }
    p.x += p.vx; p.y += p.vy;
    if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fillStyle = p.c; ctx.globalAlpha = .75; ctx.fill();
  }
  ctx.lineWidth = devicePixelRatio*.6;
  for(let i=0;i<P.length;i++) for(let j=i+1;j<P.length;j++){
    const a=P[i], b=P[j], d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<link){ ctx.globalAlpha=(1-d/link)*.25; ctx.strokeStyle='#ffffff'; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){ resize(); draw(); }

applyLang();
</script>
</body>
</html>
